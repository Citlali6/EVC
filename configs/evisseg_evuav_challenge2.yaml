STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: True
  block_reps: 2
  use_coords: True

DATA:
  input_channel: 4
  root: /mnt/d/AI/ESOD/EV-UAV-main/dataset/训练集、验证集
  whole_t: 8000
  res: [346,260]

TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 100000
  model_save_root: /mnt/d/AI/ESOD/EV-UAV-main/log/baseline_4gb_seed37

TEST:
  vis: False
  eval: True
  roc: True
  pd_detT: 50
  correct_thresh: 0.0001
  save: False
  # model_path: /mnt/d/AI/ESOD/EV-UAV-main/log/baseline_4gb_seed37/best_iou_seed37.pt
  model_path: /mnt/d/AI/ESOD/best_iou_seed37.pt
  prediction_threshold: 0.9
  challenge_output_dir: /mnt/d/AI/ESOD/EV-UAV-main/log/challenge2/val-pred-txt
